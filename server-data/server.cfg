# FiveM server config — managed by txAdmin.
#
# With this setup the server boots into txAdmin first (http://localhost:40120).
# On first run, pick the "Local" / "existing server data" option and point it
# at this folder — txAdmin will detect this server.cfg. The Cfx.re license key
# is entered in the txAdmin web UI and stored in txData, so it does NOT live
# here (keep it out of git).

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "FiveM Docker — Dev Server"
sets sv_projectName "FiveM Docker"
sets sv_projectDesc ""
sets locale "en-US"

set onesync on
sv_enforceGameBuild 3570
sv_endpointPrivacy true
sv_scriptHookAllowed 0
sv_maxclients 48

# ── Database (optional)
# If you use MySQL/MariaDB resources (oxmysql, ESX, QBox…), set the connection
# string here — host = the compose service name "mariadb" (or your external host).
# Keep real credentials out of git; prefer setting this via txAdmin.
# set mysql_connection_string "mysql://fivem:CHANGE_ME@mariadb:3306/fivem?charset=utf8mb4"

# ── Reverse proxy / server listing (optional) ────────────────────────────────
# Only needed when running behind docker-compose.traefik.yml (or any proxy/NAT),
# so the server list advertises your public hostname instead of the container IP.
# Replace play.example.com with your GAME host (the grey-cloud / DNS-only record).
# set sv_forceIndirectListing true                 # don't leak the real IP to the list
# set sv_listingHostOverride "play.example.com"    # domain the list backend queries
# set sv_endpoints "play.example.com:30120"        # game/data endpoint shown to clients
# When Traefik L4-forwards the game port, FXServer sees the proxy's container IP for
# every player. Trust that docker subnet so the HTTP connect endpoint can still read
# the real client IP (via X-Real-IP) and isn't rate-limited as one address:
# set sv_proxyIPRanges "172.16.0.0/12"             # adjust to your docker network CIDR

